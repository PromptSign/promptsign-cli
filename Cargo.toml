[workspace]
members = ["promptsign-cli"]
resolver = "2"

[workspace.package]
version = "0.3.5"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
getrandom = "0.2"
base64 = "0.22"
unicode-normalization = "0.1"

# The verifier must be a single fast static binary: it runs inside
# SessionStart/PreToolUse hooks on every agent session and skill call.
[profile.release]
lto = true
strip = true
codegen-units = 1
